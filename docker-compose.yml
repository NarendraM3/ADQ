services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      LOCAL_DATA_DIR: /app/data
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_HUGGINGFACE_BASE_URL: ${AI_HUGGINGFACE_BASE_URL:-}
      AI_GROQ_BASE_URL: ${AI_GROQ_BASE_URL:-}
      ONELAKE_ACCOUNT_URL: ${ONELAKE_ACCOUNT_URL:-}
      AZURE_BLOB_ACCOUNT_URL_TEMPLATE: ${AZURE_BLOB_ACCOUNT_URL_TEMPLATE:-}
    ports: ["8000:8000"]
    volumes: ["dq_data:/app/data"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  postgres_data:
  dq_data:
