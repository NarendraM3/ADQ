[project]
name = "dq-automation-api"
version = "0.1.0"
description = "AI-assisted data quality automation backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2", "pydantic-settings>=2.5", "python-multipart>=0.0.12",
  "cryptography>=43", "httpx>=0.27", "alembic>=1.13", "openpyxl>=3.1", "xlrd>=2.0", "pyarrow>=17"
]

[project.optional-dependencies]
cloud = ["boto3>=1.35", "azure-storage-blob>=12.23", "azure-identity>=1.19", "azure-storage-file-datalake>=12.16", "snowflake-connector-python>=3.12", "databricks-sql-connector>=3.5"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

